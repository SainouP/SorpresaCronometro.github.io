<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva</title>
    <style>
        /* Estilos base para el fondo negro inicial */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            transition: background-image 1s ease-in-out; /* Transición suave para el cambio de fondo */
        }

        /* Contenedor principal */
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px;
        }

        /* Estilos del cronómetro en el centro */
        #countdown {
            color: #ffffff;
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.7);
        }

        /* Estilos para la imagen final superpuesta */
        #final-image {
            display: none; /* Oculta por defecto */
            max-width: 450px; /* Tamaño perfecto y controlado para que no sea gigante */
            width: 90%; /* Adaptable a pantallas más chicas o celulares */
            height: auto;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
            animation: fadeIn 1.5s ease-in-out forwards; /* Aparece suavemente */
        }

        /* Animación para la aparición de la captura de pantalla */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cronómetro en el centro -->
        <div id="countdown">144:00:00</div>
        
        <!-- Imagen superpuesta oculta al inicio -->
        <img id="final-image" src="Captura de pantalla 2026-05-16 012618.png" alt="Captura Final">
    </div>

    <script>
        // Configuración del tiempo inicial en segundos (144 horas)
        // 144 horas * 60 minutos * 60 segundos = 518400 segundos
        let totalSeconds = 144 * 60 * 60; 

        /* 
           ⚠️ MODO DE PRUEBA: 
           Si quieres ver cómo funciona el efecto sin esperar 144 horas, 
           descomenta la siguiente línea (borra las dos barras //) para que empiece en 5 segundos.
        */
        // totalSeconds = 5; 

        const countdownElement = document.getElementById('countdown');
        const finalImageElement = document.getElementById('final-image');
        const bodyElement = document.body;

        function updateCountdown() {
            // Cálculos para obtener Horas, Minutos y Segundos
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            // Formateo con dos dígitos (ej. 05 en vez de 5)
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // Renderizado en pantalla
            countdownElement.textContent = `${hours}:${minutes}:${seconds}`;

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                triggerFinalEffect();
            } else {
                totalSeconds--;
            }
        }

        function triggerFinalEffect() {
            // 1. Ocultar el texto del cronómetro
            countdownElement.style.display = 'none';

            // 2. Cambiar el fondo del body a la imagen del Museo Larco
            bodyElement.style.backgroundImage = "url('MG_1544-Museo-Larco-Cafe-Restaurant.jpg')";

            // 3. Mostrar la captura de pantalla con su tamaño óptimo
            finalImageElement.style.display = 'block';
        }

        // Iniciar el intervalo para que se ejecute cada 1 segundo
        const timerInterval = setInterval(updateCountdown, 1000);
        
        // Ejecución inicial para evitar el retraso de 1 segundo al cargar
        updateCountdown();
    </script>
</body>
</html>
