<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva en Vivo</title>
    <style>
        /* Estilos base para el fondo negro inicial */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            transition: background-image 1.2s ease-in-out;
        }

        /* Contenedor principal */
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px;
        }

        /* Estilos del cronómetro en el centro */
        #countdown {
            color: #ffffff;
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }

        /* Estilos para la imagen final superpuesta */
        #final-image {
            display: none;
            max-width: 450px;
            width: 90%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.6);
            margin: 0 auto;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        /* Animación para la aparición de la captura de pantalla */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cronómetro en el centro -->
        <div id="countdown">Cargando...</div>
        
        <!-- Imagen superpuesta oculta al inicio -->
        <img id="final-image" src="Captura de pantalla 2026-05-16 012618.png" alt="Captura Final">
    </div>

    <script>
        // CONFIGURACIÓN DE FECHA OBJETIVO: Domingo 17 de Mayo de 2026 a las 20:00:00 (8:00 PM)
        // Recordatorio: En JavaScript los meses se indexan desde 0 (0 = Enero, 4 = Mayo).
        const targetDate = new Date(2026, 4, 17, 20, 0, 0).getTime();

        /* 
           ⚠️ MODO DE PRUEBA RÁPIDA:
           Si deseas verificar cómo se ve el cambio de fondo y la aparición de la imagen 
           sin esperar al domingo, descomenta las dos líneas de abajo quitando los caracteres "//".
        */
         const nowTest = new Date().getTime();
         const targetDate = nowTest + 5000; 

        const countdownElement = document.getElementById('countdown');
        const finalImageElement = document.getElementById('final-image');
        const bodyElement = document.body;

        function updateLiveCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Cuando llega a cero o el tiempo ya pasó
            if (difference <= 0) {
                clearInterval(timerInterval);
                triggerFinalEffect();
                return;
            }

            // Conversión matemática a Horas, Minutos y Segundos exactos
            let hours = Math.floor(difference / (1000 * 60 * 60));
            let minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Formato de dos dígitos estables (00:00:00)
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // Actualizar el texto en pantalla
            countdownElement.textContent = `${hours}:${minutes}:${seconds}`;
        }

        function triggerFinalEffect() {
            countdownElement.style.display = 'none';
            bodyElement.style.backgroundImage = "url('MG_1544-Museo-Larco-Cafe-Restaurant.jpg')";
            finalImageElement.style.display = 'block';
        }

        // Intervalo de refresco cada 1 segundo
        const timerInterval = setInterval(updateLiveCountdown, 1000);
        
        // Ejecución inmediata inicial para evitar saltos visuales
        updateLiveCountdown();
    </script>
</body>
</html>
